name: Create Audit Engagement Issues

on:
  # Run manually — do this immediately after setup, or after each completed audit.
  workflow_dispatch:
    inputs:
      audit_year:
        description: "The calendar year of the NEXT audit (e.g. 2027)"
        required: true
        default: "2027"

  # Scheduled run — fires 9 months after your typical audit month so partners have
  # 3 months to re-collect evidence before the next annual audit.
  #
  # HOW TO SET YOUR SCHEDULE:
  #   Take your typical audit completion month and add 9 months.
  #   Example: audit finishes in June → scheduled run fires March 1st the following year.
  #   Cron format: minute hour day month weekday
  #   The default below fires on March 1st at 09:00 UTC every year.
  #   Change the month number (currently '3') to match your offset.
  schedule:
    - cron: "0 9 1 3 *"

permissions:
  issues: write

jobs:
  create-issues:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine audit cycle year
        id: cycle
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            YEAR="${{ github.event.inputs.audit_year }}"
          else
            # Scheduled run: next audit is ~3 months away, so current year + 1 if we're
            # running in Q1, or current year if running later. Default to next year.
            YEAR=$(date -d "+3 months" +%Y)
          fi
          echo "year=$YEAR" >> $GITHUB_OUTPUT
          echo "label=audit-$YEAR" >> $GITHUB_OUTPUT
          echo "milestone=Audit $YEAR" >> $GITHUB_OUTPUT

      - name: Create labels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "pre-qualification"  --color "0e8a16" --description "Pre-qualification gate"              --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
          gh label create "module-a"           --color "e4e669" --description "Module A – General Requirements"    --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
          gh label create "module-b"           --color "d73a4a" --description "Module B – AI Apps Specific"       --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
          gh label create "${{ steps.cycle.outputs.label }}" \
            --color "0075ca" --description "Audit cycle ${{ steps.cycle.outputs.year }}" \
            --repo "$GITHUB_REPOSITORY" 2>/dev/null || true

      - name: Create or update milestone
        id: milestone
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="${{ steps.cycle.outputs.milestone }}"
          # Audit due date: June 30 of the target year (adjust to your actual audit window)
          DUE="${{ steps.cycle.outputs.year }}-06-30T00:00:00Z"

          EXISTING=$(gh api repos/$GITHUB_REPOSITORY/milestones \
            --jq ".[] | select(.title == \"$TITLE\") | .number" 2>/dev/null || echo "")

          if [ -z "$EXISTING" ]; then
            NUMBER=$(gh api repos/$GITHUB_REPOSITORY/milestones \
              --method POST \
              --field title="$TITLE" \
              --field due_on="$DUE" \
              --field description="AI Apps on Microsoft Azure Advanced Specialization – ${{ steps.cycle.outputs.year }} audit cycle" \
              --jq ".number")
            echo "number=$NUMBER" >> $GITHUB_OUTPUT
          else
            echo "number=$EXISTING" >> $GITHUB_OUTPUT
          fi

      - name: Create issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CYCLE_LABEL: ${{ steps.cycle.outputs.label }}
          MILESTONE: ${{ steps.milestone.outputs.number }}
          REPO: ${{ github.repository }}
        run: bash .github/scripts/create-issues.sh
